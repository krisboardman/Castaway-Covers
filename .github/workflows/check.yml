name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Calculator check
        run: node check-calculators.js
      - name: Image check
        run: node check-images.js
      - name: Lint
        # 91 existing errors in src; reported but not blocking until they are cleaned up.
        run: npm run lint
        continue-on-error: true
      - name: Build
        run: npm run build
