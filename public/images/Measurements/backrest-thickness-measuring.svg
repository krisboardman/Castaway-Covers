<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 390" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrowL" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Transparent background -->
  <rect width="500" height="390" fill="none"/>

  <!-- Title -->
  <text x="250" y="28" text-anchor="middle" font-size="18" font-weight="600" fill="#1a1a1a">Measuring Backrest Thickness</text>
  <text x="250" y="48" text-anchor="middle" font-size="13" fill="#666">Side view</text>

  <!-- ============ DIMENSION LABEL ============ -->
  <text x="305" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">Backrest Thickness</text>

  <!-- ============ DIMENSION LINE & EXTENSIONS ============ -->
  <!-- Dimension line above the backrest top -->
  <line x1="290" y1="96" x2="340" y2="96" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arrowL)" marker-end="url(#arrowR)"/>
  <!-- Extension lines down to the backrest top edge -->
  <line x1="290" y1="96" x2="290" y2="118" stroke="#1a1a1a" stroke-width="0.7" stroke-dasharray="3,3"/>
  <line x1="340" y1="96" x2="340" y2="118" stroke="#1a1a1a" stroke-width="0.7" stroke-dasharray="3,3"/>

  <!-- ============ CHAIR SIDE-VIEW WIREFRAME ============ -->
  <!-- Top edge of backrest — emphasized so it's clear what's being measured -->
  <line x1="290" y1="118" x2="340" y2="118" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- Backrest panel (rigid frame — cushions removed). Thickness is the visible width here. -->
  <rect x="290" y="118" width="50" height="135" fill="none" stroke="#333" stroke-width="1.5"/>

  <!-- Seat frame -->
  <rect x="110" y="253" width="230" height="48" fill="none" stroke="#333" stroke-width="1.5"/>

  <!-- Seat legs -->
  <line x1="130" y1="301" x2="130" y2="340" stroke="#333" stroke-width="1.5"/>
  <line x1="320" y1="301" x2="320" y2="340" stroke="#333" stroke-width="1.5"/>

  <!-- Floor line -->
  <line x1="60" y1="340" x2="430" y2="340" stroke="#999" stroke-width="0.7"/>

  <!-- ============ ORIENTATION LABELS ============ -->
  <text x="130" y="360" text-anchor="middle" font-size="11" fill="#666" font-style="italic">front of seat</text>
  <text x="320" y="360" text-anchor="middle" font-size="11" fill="#666" font-style="italic">back of seat</text>

  <!-- ============ HELPER NOTE ============ -->
  <text x="250" y="382" text-anchor="middle" font-size="11" fill="#666">Measure the back panel only (cushions removed) — front face to back face at the top edge</text>
</svg>
