<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrowL" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Transparent background -->
  <rect width="500" height="400" fill="none"/>

  <!-- Title -->
  <text x="250" y="32" text-anchor="middle" font-size="18" font-weight="600" fill="#1a1a1a">Measuring Curved-Back Furniture</text>
  <text x="250" y="52" text-anchor="middle" font-size="13" fill="#666">Top View</text>

  <!-- ============ CHAIR TOP VIEW — WIREFRAME ============ -->

  <!-- Seat area outline -->
  <rect x="140" y="160" width="220" height="160" rx="6" fill="none" stroke="#333" stroke-width="1.5"/>

  <!-- Curved back outline -->
  <path d="M120,165 Q130,95 250,75 Q370,95 380,165" fill="none" stroke="#333" stroke-width="1.5"/>
  <!-- Connect curved back to seat sides -->
  <line x1="120" y1="165" x2="140" y2="160" stroke="#333" stroke-width="1.5"/>
  <line x1="380" y1="165" x2="360" y2="160" stroke="#333" stroke-width="1.5"/>

  <!-- Left armrest outline -->
  <rect x="120" y="160" width="22" height="160" rx="3" fill="none" stroke="#333" stroke-width="1.2"/>

  <!-- Right armrest outline -->
  <rect x="358" y="160" width="22" height="160" rx="3" fill="none" stroke="#333" stroke-width="1.2"/>

  <!-- Inner seat/cushion outline (dashed) -->
  <rect x="148" y="168" width="204" height="144" rx="10" fill="none" stroke="#999" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- ============ DIMENSION: WIDTH ============ -->
  <line x1="122" y1="352" x2="378" y2="352" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arrowL)" marker-end="url(#arrowR)"/>
  <!-- Tick marks -->
  <line x1="131" y1="325" x2="131" y2="358" stroke="#1a1a1a" stroke-width="0.7"/>
  <line x1="369" y1="325" x2="369" y2="358" stroke="#1a1a1a" stroke-width="0.7"/>
  <!-- Label -->
  <text x="250" y="376" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">Width</text>

  <!-- ============ DIMENSION: DEPTH ============ -->
  <line x1="55" y1="75" x2="55" y2="318" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arrowL)" marker-end="url(#arrowR)"/>
  <!-- Tick marks (dashed leader lines) -->
  <line x1="48" y1="75" x2="130" y2="75" stroke="#1a1a1a" stroke-width="0.7" stroke-dasharray="3,3"/>
  <line x1="48" y1="320" x2="140" y2="320" stroke="#1a1a1a" stroke-width="0.7" stroke-dasharray="3,3"/>
  <!-- Center-back reference dot at peak of curve -->
  <circle cx="250" cy="75" r="3" fill="none" stroke="#333" stroke-width="1.2"/>
  <line x1="247" y1="75" x2="62" y2="75" stroke="#1a1a1a" stroke-width="0.7" stroke-dasharray="3,3"/>
  <!-- Label -->
  <text x="44" y="200" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a" transform="rotate(-90, 44, 200)">Depth</text>

  <!-- ============ ANNOTATIONS ============ -->
  <text x="250" y="68" text-anchor="middle" font-size="11" fill="#666" font-style="italic">back</text>
  <text x="250" y="336" text-anchor="middle" font-size="11" fill="#666" font-style="italic">front</text>

</svg>